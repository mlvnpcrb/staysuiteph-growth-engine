name: Foundation checks
on:
  push:
    branches: [chore/initial-project-setup, feat/phase-2-group-finder]
  pull_request:
concurrency:
  group: foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: staysuite-extension-0.3.0
          path: apps/extension/build/chrome-mv3-prod/
          retention-days: 14
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @staysuite/web build
      - run: pnpm --filter @staysuite/extension build
      - name: Install supported Chromium and OS dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Native Facebook collection boundary
        run: pnpm test:extension
        timeout-minutes: 3
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 7
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The pinned CLI supports the original public image registry. Its default
      # public ECR endpoint has repeatedly throttled isolated CI startup.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Short-lived JWTs for isolated refresh validation
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('supabase/config.toml')
          text = p.read_text()
          assert 'jwt_expiry = 3600' in text
          p.write_text(text.replace('jwt_expiry = 3600', 'jwt_expiry = 120'))
          PYTHON
      - name: Start Supabase with sanitized failure annotation
        run: |
          if ! pnpm exec supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            node scripts/report-supabase-start.mjs "$RUNNER_TEMP/supabase-start.log"
            exit 1
          fi
      - run: pnpm db:test
      - name: Check campaign storage and claims before browser installation
        run: pnpm test:supabase:auth --queue-only
      - run: pnpm --filter @staysuite/web build
      - name: Use runner Chrome for authenticated database checks
        run: |
          staysuite_auth_browser="$(command -v google-chrome)"
          test -x "$staysuite_auth_browser"
          printf 'PLAYWRIGHT_CHROMIUM_EXECUTABLE=%s\n' "$staysuite_auth_browser" >> "$GITHUB_ENV"
      - run: pnpm test:supabase:auth
      - if: always()
        run: pnpm exec supabase stop --no-backup
  # Preserve the original gate name. Never make skipped or failed jobs look successful.
  validate:
    if: always()
    needs: [quality, browser, database]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every foundation check
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$DATABASE_RESULT" = success

  preview:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/phase-2-group-finder'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: preview
    outputs:
      url: ${{ steps.deploy.outputs.preview_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy tested commit to Preview and smoke test
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: node scripts/deploy-preview.mjs

  live-audit:
    name: Real deployed Preview verification
    needs: preview
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: preview
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select runner Chrome
        run: |
          staysuite_audit_browser="$(command -v google-chrome)"
          test -x "$staysuite_audit_browser"
          printf 'PLAYWRIGHT_CHROMIUM_EXECUTABLE=%s\n' "$staysuite_audit_browser" >> "$GITHUB_ENV"
      - name: Audit the requested original Preview (real browser, no mocks)
        env:
          PREVIEW_AUDIT_URL: https://staysuiteph-growth-engine-jbx1kj0ri-mlvnpcrbs-projects.vercel.app
          PREVIEW_AUDIT_OUTPUT: preview-audit/requested
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/audit-live-preview.mjs
      - name: Audit the updated Preview (real browser, no mocks)
        if: always()
        env:
          PREVIEW_AUDIT_URL: ${{ needs.preview.outputs.url }}
          PREVIEW_AUDIT_OUTPUT: preview-audit/updated
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/audit-live-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-preview-verification
          path: preview-audit/
          retention-days: 7
